version: '3.8'

services:
  # 1. MariaDB 資料庫服務
  mariadb:
    image: mariadb:10.11
    container_name: stock_dashboard_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: kakcsv3@dmin0609 # 請修改為您的 MariaDB Root 密碼
      MYSQL_DATABASE: stock_dashboard
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - stock_net

  # 2. FastAPI 後端 API 服務
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock_dashboard_backend
    restart: always
    depends_on:
      - mariadb
    environment:
      # 資料庫連線字串 (使用容器內部名稱 mariadb)
      DATABASE_URL: "mysql+aiomysql://root:kakcsv3@Dmin0609@mariadb:3306/stock_dashboard"
    ports:
      - "8000:8000"
    networks:
      - stock_net

volumes:
  mariadb_data:
    driver: local

networks:
  stock_net:
    driver: bridge